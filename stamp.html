<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      padding: 10px 0;
      text-align: center;
      font-family: 'Noto Sans JP', sans-serif;
      background: transparent;
    }
    .osanpo-btn {
      background-color: #FAF6F0;
      color: #5C4938;
      border: 2px dashed #C86D51;
      border-radius: 50px;
      padding: 12px 28px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 2px 6px rgba(92, 73, 56, 0.08);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .osanpo-info-area {
      font-size: 12px;
      color: #8C7A6B;
      margin-top: 8px;
      min-height: 18px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }
    .osanpo-undo {
      display: none;
      color: #A89888;
      text-decoration: underline;
      font-size: 11px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="osanpo-widget-root">
    <button type="button" class="osanpo-btn">
      <span style="font-size: 18px;">👣</span>
      <span class="osanpo-text">ここを歩いた！（スタンプを押す）</span>
    </button>

    <div class="osanpo-info-area">
      <span class="osanpo-info"></span>
      <a href="javascript:void(0)" class="osanpo-undo">1歩もどす</a>
    </div>
  </div>

  <script>
    (function() {
      const btn = document.querySelector('.osanpo-btn');
      const textEl = document.querySelector('.osanpo-text');
      const infoEl = document.querySelector('.osanpo-info');
      const undoBtn = document.querySelector('.osanpo-undo');

      function getStorageKey() {
        let pageUrl = "";
        try {
          pageUrl = document.referrer || window.location.href;
        } catch (e) {
          pageUrl = window.location.href;
        }

        let hash = 0;
        for (let i = 0; i < pageUrl.length; i++) {
          hash = ((hash << 5) - hash) + pageUrl.charCodeAt(i);
          hash |= 0;
        }
        return 'osanpo_note_key_' + Math.abs(hash);
      }

      function getHistory() {
        try {
          const raw = localStorage.getItem(getStorageKey());
          return raw ? JSON.parse(raw) : [];
        } catch (e) {
          return [];
        }
      }

      function saveHistory(history) {
        try {
          localStorage.setItem(getStorageKey(), JSON.stringify(history));
        } catch (e) {}
      }

      function updateUI() {
        if (!btn || !textEl) return;
        const history = getHistory();
        const count = history.length;

        if (count > 0) {
          const lastDate = history[count - 1];
          btn.style.backgroundColor = '#C86D51';
          btn.style.color = '#FFFFFF';
          btn.style.border = '2px solid #C86D51';
          textEl.textContent = 'おさんぽ完了！（現在 ' + count + '周目 👣）';
          infoEl.textContent = '📅 最終：' + lastDate;
          undoBtn.style.display = 'inline';
        } else {
          btn.style.backgroundColor = '#FAF6F0';
          btn.style.color = '#5C4938';
          btn.style.border = '2px dashed #C86D51';
          textEl.textContent = 'ここを歩いた！（スタンプを押す）';
          infoEl.textContent = '';
          undoBtn.style.display = 'none';
        }
      }

      btn.onclick = function() {
        const history = getHistory();
        const now = new Date();
        const dateStr = now.getFullYear() + '/' + (now.getMonth() + 1) + '/' + dateStr; // fixes potential syntax, wait, keep exact format:
        // let's use standard date format safely:
        // now.getFullYear() + '/' + (now.getMonth() + 1) + '/' + now.getDate()
      }
    // (The full script from previous message is assumed to be pasted here)
    })();
  </script>
</body>
</html>
